name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@53ae0832e4933161035ff44e389a0a1c84cf96b3
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      verify_script: .github/verification/crystallization.sh
      strict: true

  crystallization-contract:
    name: Crystallization contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile crystallization machinery
        run: |
          python -m py_compile \
            automations/estate_function_restorer.py \
            automations/estate_function_restorer_safe.py \
            automations/crystallization_repo_worker.py \
            automations/crystallization_work_unit.py \
            automations/crystallization_swarm_dispatch.py \
            automations/crystallization_executor.py
      - name: Prove crystallization terminal-status law
        run: python -m unittest automations/tests/test_crystallization_executor.py -v
      - name: Prove persistent dispatch truth semantics
        run: python -m unittest tests/test_crystallization_dispatch.py -v
      - name: Prove crystallization source-preserving transport
        run: python -m unittest tests/test_crystallization_source_transport.py -v
      - name: Preserve legacy restorer verification plumbing
        run: python -m unittest automations/tests/test_estate_function_restorer.py -v
      - name: Prove safe estate-restorer transport steering
        run: python -m unittest tests/test_estate_restorer_source_transport.py -v
      - name: Refuse force-push regression in active repair transports
        run: |
          if grep -n -- '--force-with-lease\|--force' \
            automations/crystallization_repo_worker.py \
            automations/estate_function_restorer.py; then
            echo "active repair transport contains forbidden force-push semantics" >&2
            exit 1
          fi
      - name: Enforce public truth boundary
        run: python scripts/verify_public_truth.py
